name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke-windows:
    name: Smoke test (Windows + LibreOffice)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install LibreOffice
        shell: pwsh
        run: choco install libreoffice-fresh -y --no-progress

      - name: Run end-to-end smoke test
        shell: pwsh
        env:
          # GitHub-runner LibreOffice installs to default Program Files path; explicit
          # override gives the resolver a deterministic answer.
          SLIDE_LAB_SOFFICE: 'C:\Program Files\LibreOffice\program\soffice.exe'
        run: |
          python smoke_test.py

      - name: Upload smoke output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-out-windows
          path: _smoke_out/
          retention-days: 7

  smoke-linux:
    name: Smoke test (Linux + LibreOffice)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps (skip Windows-only)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # pywin32 is Windows-only and gated in requirements.txt by platform marker.
          pip install -r requirements.txt

      - name: Install LibreOffice
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice --no-install-recommends

      - name: Run end-to-end smoke test
        shell: bash
        run: python smoke_test.py

      - name: Upload smoke output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-out-linux
          path: _smoke_out/
          retention-days: 7
