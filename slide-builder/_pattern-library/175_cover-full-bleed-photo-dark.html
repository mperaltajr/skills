<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Pattern 175 — Cover: Full-Bleed Photo with Title Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

  :root {
    --brand-primary:#2D0A4E;
    --brand-primary-mid:#5C2D87;
    --brand-accent:#A100FF;
    --brand-accent-soft:#C780FF;
    --text-dark:#1A1A2E;
    --text-mid:#64748B;
    --text-faint:#94A3B8;
    --slide-bg:#FFFFFF;
    --card-bg:#F8F4FC;
    --card-border:#E5D5F0;
    --draft-bg:#FFD600;
    --draft-text:#B71C1C;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: Inter, system-ui, sans-serif;
  }

  /* ── Slide canvas ── */
  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    overflow: hidden;
  }

  /* ── Full-bleed photo simulation ── */
  .photo-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a0533 0%, #2D0A4E 40%, #0d1b4b 100%);
  }

  /* Subtle texture overlay — faint radial highlight to give depth */
  .photo-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 65% 35%, rgba(93,45,135,0.45) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 20% 70%, rgba(161,0,255,0.08) 0%, transparent 60%);
  }

  /* ── Bottom-third darkening overlay ── */
  .bottom-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 340px;
    background: linear-gradient(to top, rgba(8,2,20,0.92) 0%, rgba(13,5,30,0.75) 50%, transparent 100%);
  }

  /* ── Invariant chrome: top-left label ── */
  .project-label {
    position: absolute;
    top: 24px;
    left: 24px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    z-index: 20;
  }

  /* ── Invariant chrome: DRAFT badge ── */
  .draft-badge {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--draft-bg);
    color: var(--draft-text);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 16px;
    border-radius: 0;
    z-index: 20;
    white-space: nowrap;
  }

  /* ── Top-right: Accenture wordmark placeholder ── */
  .wordmark {
    position: absolute;
    top: 14px;
    right: 24px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.90);
    z-index: 20;
  }

  /* ── Title block — bottom-left ── */
  .title-block {
    position: absolute;
    left: 56px;
    bottom: 76px;
    max-width: 680px;
    z-index: 10;
  }

  .accent-rule {
    width: 80px;
    height: 3px;
    background: rgba(255,255,255,0.75);
    margin-bottom: 20px;
  }

  .slide-title {
    font-size: 40px;
    font-weight: 700;
    line-height: 1.2;
    color: #ffffff;
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }

  .slide-title strong {
    color: var(--brand-accent-soft);
    font-weight: 700;
  }

  .slide-subtitle {
    font-size: 16px;
    font-style: italic;
    font-weight: 400;
    color: rgba(255,255,255,0.80);
    margin-bottom: 24px;
    line-height: 1.5;
    letter-spacing: 0.01em;
  }

  .client-date {
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }

  /* ── Invariant chrome: footer ── */
  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: rgba(8,2,20,0.72);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 20;
  }

  .footer-left,
  .footer-right {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.40);
  }

  /* DARK THEME */
  /* This pattern already has a dark base (full-bleed dark photo bg).
     We deepen the overlay slightly and ensure the photo-bg uses pure dark purple. */
  .photo-bg {
    background: linear-gradient(135deg, #150226 0%, #2D0A4E 40%, #07102e 100%);
  }

  .photo-bg::before {
    background:
      radial-gradient(ellipse 70% 60% at 65% 35%, rgba(93,45,135,0.55) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 20% 70%, rgba(161,0,255,0.12) 0%, transparent 60%);
  }

  .accent-rule { background: #A100FF; }

  .footer { background: rgba(0,0,0,0.6); border-top: 1px solid rgba(255,255,255,0.1); }
  .footer-left, .footer-right { color: rgba(255,255,255,0.4); }
</style>
</head>
<body>
<div class="slide">

  <!-- Full-bleed photo simulation -->
  <div class="photo-bg" data-shape-id="cover-photo-bg"></div>

  <!-- Bottom-third darkening overlay -->
  <div class="bottom-overlay" data-shape-id="cover-bottom-overlay"></div>

  <!-- Chrome: top-left internal label -->

  <!-- Chrome: DRAFT badge -->

  <!-- Top-right: Accenture wordmark -->
  <div class="wordmark" data-shape-id="cover-wordmark">Accenture</div>

  <!-- Title block -->
  <div class="title-block">
    <div class="slide-subtitle" data-shape-id="cover-eyebrow">Driving Resilience in a Volatile World</div>
    <div class="slide-title" data-shape-id="cover-deck-title">The Future of <strong>Enterprise</strong><br>Digital Transformation</div>
    <div class="accent-rule" data-shape-id="cover-rule"></div>
    <div class="client-date" data-shape-id="cover-meta">Client Name &nbsp;·&nbsp; May 2026 &nbsp;·&nbsp; Confidential</div>
  </div>

  <!-- Chrome: footer -->
  <div class="footer">
    <span class="footer-left" data-shape-id="footer-left">Confidential — Accenture Internal</span>
    <span class="footer-right" data-shape-id="footer-right">Slide Lab · 2026 · 175d</span>
  </div>

</div>
</body>
</html>
