<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>34 · Cycle diagram</title>
<style>
:root {
  --brand-primary: #2D0A4E;
  --brand-primary-mid: #5C2D87;
  --brand-accent: #A100FF;
  --brand-accent-soft: #C780FF;
  --text-dark: #1A1A2E;
  --text-mid: #64748B;
  --text-faint: #94A3B8;
  --slide-bg: #FFFFFF;
  --card-bg: #F8F4FC;
  --card-border: #E5D5F0;
  --draft-bg: #FFD600;
  --draft-text: #B71C1C;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; background: var(--slide-bg); font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--text-dark); overflow: hidden; }
body { padding: 50px 64px 80px 64px; position: relative; }
.draft-badge { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: var(--draft-bg); color: var(--draft-text); font-size: 11px; font-weight: 700; padding: 4px 16px; letter-spacing: 1px; }
.project-label { position: absolute; top: 24px; left: 24px; color: var(--text-faint); font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }

/* ---- Title block ---- */
.action-title { position: absolute; left: 64px; right: 64px; top: 28px; min-height: 72px; font-size: 28px; font-weight: 700; line-height: 1.2; max-width: 1050px; }
.action-title strong { color: var(--brand-primary); }
.subhead { position: absolute; left: 64px; right: 64px; top: 100px; font-size: 14px; color: var(--text-mid); font-style: italic; }
.title-rule { position: absolute; left: 64px; top: 128px; width: 40px; height: 3px; background: var(--brand-accent); }

/* ---- Cycle canvas ---- */
.chart-block {
  position: absolute;
  left: 64px;
  right: 64px;
  top: 205px;
  bottom: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.chart-svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
}
.chart-svg text { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }

.node-label { font-size: 16px; font-weight: 800; letter-spacing: 2px; fill: #FFFFFF; }
.center-label { font-size: 11px; font-weight: 800; letter-spacing: 2.4px; fill: var(--brand-accent); }

.callout-title { font-size: 14px; font-weight: 800; letter-spacing: 1.4px; fill: var(--brand-primary); }
.callout-line  { font-size: 11px; font-weight: 500; fill: var(--text-mid); }

/* ---- Convergence strip ---- */
.convergence {
  position: absolute;
  left: 64px;
  right: 64px;
  bottom: 70px;
  background: var(--brand-primary);
  color: white;
  padding: 12px 22px;
  font-size: 14px;
  font-style: italic;
  font-weight: 500;
}

/* ---- Footer invariant ---- */
.footer-rule { position: absolute; left: 0; right: 0; bottom: 32px; height: 1px; background: var(--card-border); }
.footer-left { position: absolute; bottom: 14px; left: 24px; color: var(--text-faint); font-size: 11px; letter-spacing: 1px; }
.footer-right { position: absolute; bottom: 14px; right: 24px; color: var(--text-faint); font-size: 11px; }
</style>
</head>
<body>

  <div class="action-title" data-shape-id="title">The Slide Lab loop — <strong>four phases, repeating with every deck.</strong></div>
  <div class="subhead" data-shape-id="subtitle">Think, argue, build, review — then start the next loop. The deck improves loop by loop, not page by page.</div>
  <div class="title-rule" data-shape-id="brand-rule"></div>

  <div class="chart-block">
    <!--
      SVG viewBox: 1152 x 405
      Center of cycle: (576, 202)
      Node centers (radius 110 from center, on N/E/S/W axes):
        N (THINK):  (576,  92)
        E (ARGUE):  (686, 202)
        S (BUILD):  (576, 312)
        W (REVIEW): (466, 202)
      Node radius: 55  (~140px diameter scaled to canvas)
      Clockwise arc arrows ride an outer ring of radius 150 from center.

      Callouts:
        N: above THINK — single inline bullet line (vertical space is tight)
        E: right of ARGUE — stacked 3-line bullets
        S: below BUILD — single inline bullet line
        W: left of REVIEW — stacked 3-line bullets
      The N/E/S/W axes are symmetric; N+S are short-form, E+W are long-form,
      preserving balance about both axes.
    -->
    <svg class="chart-svg" viewBox="0 0 1152 405" preserveAspectRatio="xMidYMid meet" data-shape-id="chart-canvas">

      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="#A100FF"/>
        </marker>
      </defs>

      <!-- ===== Clockwise curved arrows between adjacent nodes =====
           Each arc exits node perimeter (r=55) tangent to the cycle and arrives
           tangent at the next node. Arc radius 150, clockwise sweep flag = 1.
      -->
      <g fill="none" stroke="#A100FF" stroke-width="3" stroke-linecap="round">
        <!-- THINK (top) -> ARGUE (right) -->
        <path d="M 615 131 A 150 150 0 0 1 647 163" marker-end="url(#arrowhead)"/>
        <!-- ARGUE (right) -> BUILD (bottom) -->
        <path d="M 647 241 A 150 150 0 0 1 615 273" marker-end="url(#arrowhead)"/>
        <!-- BUILD (bottom) -> REVIEW (left) -->
        <path d="M 537 273 A 150 150 0 0 1 505 241" marker-end="url(#arrowhead)"/>
        <!-- REVIEW (left) -> THINK (top) -->
        <path d="M 505 163 A 150 150 0 0 1 537 131" marker-end="url(#arrowhead)"/>
      </g>

      <!-- ===== Center anchor ===== -->
      <circle cx="576" cy="202" r="6" fill="#A100FF"/>
      <text x="576" y="228" text-anchor="middle" class="center-label">ITERATE</text>

      <!-- ===== Nodes (r=55, brand-primary fill, white label) ===== -->
      <!-- N: THINK -->
      <g>
        <circle cx="576" cy="92" r="55" fill="#2D0A4E"/>
        <text x="576" y="98" text-anchor="middle" class="node-label">THINK</text>
      </g>
      <!-- E: ARGUE -->
      <g>
        <circle cx="686" cy="202" r="55" fill="#2D0A4E"/>
        <text x="686" y="208" text-anchor="middle" class="node-label">ARGUE</text>
      </g>
      <!-- S: BUILD -->
      <g>
        <circle cx="576" cy="312" r="55" fill="#2D0A4E"/>
        <text x="576" y="318" text-anchor="middle" class="node-label">BUILD</text>
      </g>
      <!-- W: REVIEW -->
      <g>
        <circle cx="466" cy="202" r="55" fill="#2D0A4E"/>
        <text x="466" y="208" text-anchor="middle" class="node-label">REVIEW</text>
      </g>

      <!-- ===== Callouts ===== -->

      <!-- NORTH callout (above THINK) — inline bullet line -->
      <g>
        <line x1="576" y1="37" x2="576" y2="22" stroke="#C780FF" stroke-width="1.5"/>
        <text x="576" y="10" text-anchor="middle" class="callout-title">THINK</text>
        <text x="576" y="-8" text-anchor="middle" class="callout-line">Frame the problem  ·  Identify the governing thought  ·  Map MECE structure</text>
      </g>

      <!-- EAST callout (right of ARGUE) — stacked bullets -->
      <g>
        <line x1="741" y1="202" x2="760" y2="202" stroke="#C780FF" stroke-width="1.5"/>
        <text x="770" y="184" class="callout-title">ARGUE</text>
        <text x="770" y="204" class="callout-line">Test claims</text>
        <text x="770" y="220" class="callout-line">Surface counterexamples</text>
        <text x="770" y="236" class="callout-line">Sharpen the so-what</text>
      </g>

      <!-- SOUTH callout (below BUILD) — inline bullet line -->
      <g>
        <line x1="576" y1="367" x2="576" y2="382" stroke="#C780FF" stroke-width="1.5"/>
        <text x="576" y="395" text-anchor="middle" class="callout-title">BUILD</text>
        <text x="576" y="412" text-anchor="middle" class="callout-line">Pick page type  ·  Apply visual treatment  ·  Render real PPTX</text>
      </g>

      <!-- WEST callout (left of REVIEW) — stacked bullets -->
      <g>
        <line x1="411" y1="202" x2="392" y2="202" stroke="#C780FF" stroke-width="1.5"/>
        <text x="382" y="184" text-anchor="end" class="callout-title">REVIEW</text>
        <text x="382" y="204" text-anchor="end" class="callout-line">Run QC</text>
        <text x="382" y="220" text-anchor="end" class="callout-line">Capture feedback</text>
        <text x="382" y="236" text-anchor="end" class="callout-line">Update the patterns</text>
      </g>

    </svg>
  </div>

  <div class="convergence" data-shape-id="convergence">Every deck is one loop. The fastest improvement comes from completing more loops, not making longer ones.</div>
  <div class="footer-left" data-shape-id="footer-left"></div>
  <div class="footer-right" data-shape-id="footer-right"></div>
</body>
</html>
