<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>15 · Org chart hierarchy</title>
<style>
:root {
  --brand-primary: #2D0A4E;
  --brand-primary-mid: #5C2D87;
  --brand-accent: #A100FF;
  --brand-accent-soft: #C780FF;
  --text-dark: #1A1A2E;
  --text-mid: #64748B;
  --text-faint: #94A3B8;
  --slide-bg: #FFFFFF;
  --card-bg: #F8F4FC;
  --card-border: #E5D5F0;
  --draft-bg: #FFD600;
  --draft-text: #B71C1C;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; background: var(--slide-bg); font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--text-dark); overflow: hidden; }
body { padding: 50px 64px 80px 64px; position: relative; }
.draft-badge { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: var(--draft-bg); color: var(--draft-text); font-size: 11px; font-weight: 700; padding: 4px 16px; letter-spacing: 1px; }
.project-label { position: absolute; top: 24px; left: 24px; color: var(--text-faint); font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }

/* ---- Title block ---- */
.action-title { position: absolute; left: 64px; right: 64px; top: 28px; min-height: 72px; font-size: 28px; font-weight: 700; line-height: 1.2; max-width: 1050px; }
.action-title strong { color: var(--brand-primary); }
.subhead { position: absolute; left: 64px; right: 64px; top: 100px; font-size: 14px; color: var(--text-mid); font-style: italic; }
.title-rule { position: absolute; left: 64px; top: 128px; width: 40px; height: 3px; background: var(--brand-accent); }

/* ---- Org chart canvas: SVG drives geometry so connectors stay grid-aligned ---- */
.chart-block {
  position: absolute;
  left: 64px;
  right: 64px;
  top: 215px;
  bottom: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.chart-svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* SVG text uses CSS for crisp font rendering */
.chart-svg text { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }
.box-name { font-size: 14px; font-weight: 700; }
.box-role { font-size: 11px; font-weight: 500; opacity: 0.85; }
.leaf-name { font-size: 14px; font-weight: 700; fill: var(--brand-primary); }
.leaf-role { font-size: 10px; font-weight: 500; fill: var(--text-mid); }

/* ---- Convergence strip ---- */
.convergence {
  position: absolute;
  left: 64px;
  right: 64px;
  bottom: 70px;
  background: var(--brand-primary);
  color: white;
  padding: 12px 22px;
  font-size: 14px;
  font-style: italic;
  font-weight: 500;
}

/* ---- Footer invariant ---- */
.footer-rule { position: absolute; left: 0; right: 0; bottom: 32px; height: 1px; background: var(--card-border); }
.footer-left { position: absolute; bottom: 14px; left: 24px; color: var(--text-faint); font-size: 11px; letter-spacing: 1px; }
.footer-right { position: absolute; bottom: 14px; right: 24px; color: var(--text-faint); font-size: 11px; }
</style>
</head>
<body>

  <div class="action-title" data-shape-id="title">Pilot governance — <strong>three leads, eight contributors</strong>.</div>
  <div class="subhead" data-shape-id="subtitle">One sponsor sets direction. Three workstream leads own delivery. Contributors execute against a single rail.</div>
  <div class="title-rule" data-shape-id="brand-rule"></div>

  <div class="chart-block">
    <!--
      SVG viewBox sized to comfortably hold the 3-level chart.
      Coordinates:
        Root box     : 446,10  (220x80)   center x = 556
        Level-2 rail : y = 150
        Level-2 boxes (180x70) centered on x = 175, 556, 937, top y = 165
          left center = 175, mid center = 556, right center = 937
        Leaf rail    : y = 295
        Leaves (140x56) at y = 310
          Branch A leaves x-centers: 95, 255      (2 leaves)
          Branch B leaves x-centers: 416, 556, 696 (3 leaves)
          Branch C leaves x-centers: 857, 1017   (2 leaves)  -> shift to align under branch C center 937: 857, 1017
      Connectors:
        Root center (556) → down to 150 (rail y)
        Horizontal rail from 175 to 937 at y=150
        Down from each level-2 center to top of level-2 box (165) — 15px stub
        Down from each level-2 bottom (165+70=235) to leaf rail (295) — split at y=275 for branch rails
    -->
    <svg class="chart-svg" data-shape-id="chart-canvas" viewBox="0 0 1112 400" preserveAspectRatio="xMidYMid meet">
      <!-- Connector lines: drawn FIRST so boxes sit on top -->
      <g stroke="#E5D5F0" stroke-width="2" fill="none" stroke-linecap="square">
        <!-- Root down to horizontal rail -->
        <line x1="556" y1="90" x2="556" y2="150"/>
        <!-- Horizontal rail between three workstream leads -->
        <line x1="175" y1="150" x2="937" y2="150"/>
        <!-- Vertical stubs from rail to top of each level-2 box -->
        <line x1="175" y1="150" x2="175" y2="165"/>
        <line x1="556" y1="150" x2="556" y2="165"/>
        <line x1="937" y1="150" x2="937" y2="165"/>

        <!-- Branch A: lead bottom (235) down, split rail at 275, then down to leaves -->
        <line x1="175" y1="235" x2="175" y2="275"/>
        <line x1="95"  y1="275" x2="255" y2="275"/>
        <line x1="95"  y1="275" x2="95"  y2="310"/>
        <line x1="255" y1="275" x2="255" y2="310"/>

        <!-- Branch B: 3 leaves -->
        <line x1="556" y1="235" x2="556" y2="275"/>
        <line x1="416" y1="275" x2="696" y2="275"/>
        <line x1="416" y1="275" x2="416" y2="310"/>
        <line x1="556" y1="275" x2="556" y2="310"/>
        <line x1="696" y1="275" x2="696" y2="310"/>

        <!-- Branch C: 2 leaves -->
        <line x1="937" y1="235" x2="937" y2="275"/>
        <line x1="857" y1="275" x2="1017" y2="275"/>
        <line x1="857" y1="275" x2="857"  y2="310"/>
        <line x1="1017" y1="275" x2="1017" y2="310"/>
      </g>

      <!-- ROOT box (220x80) at x=446, y=10 -->
      <g>
        <rect x="446" y="10" width="220" height="80" fill="#2D0A4E"/>
        <text x="556" y="42" text-anchor="middle" class="box-name" fill="#FFFFFF">Maria Chen</text>
        <text x="556" y="60" text-anchor="middle" class="box-role" fill="#FFFFFF">Program Sponsor</text>
        <text x="556" y="76" text-anchor="middle" class="box-role" fill="#C780FF">MD</text>
      </g>

      <!-- LEVEL-2 boxes (180x70) — centers 175, 556, 937 -->
      <g>
        <rect x="85"  y="165" width="180" height="70" fill="#5C2D87"/>
        <text x="175" y="195" text-anchor="middle" class="box-name" fill="#FFFFFF">Mario Peralta</text>
        <text x="175" y="213" text-anchor="middle" class="box-role" fill="#FFFFFF">Workstream A Lead</text>
        <text x="175" y="227" text-anchor="middle" class="box-role" fill="#C780FF">Manager</text>
      </g>
      <g>
        <rect x="466" y="165" width="180" height="70" fill="#5C2D87"/>
        <text x="556" y="195" text-anchor="middle" class="box-name" fill="#FFFFFF">Jamie Patel</text>
        <text x="556" y="213" text-anchor="middle" class="box-role" fill="#FFFFFF">Workstream B Lead</text>
        <text x="556" y="227" text-anchor="middle" class="box-role" fill="#C780FF">Manager</text>
      </g>
      <g>
        <rect x="847" y="165" width="180" height="70" fill="#5C2D87"/>
        <text x="937" y="195" text-anchor="middle" class="box-name" fill="#FFFFFF">Devon Reyes</text>
        <text x="937" y="213" text-anchor="middle" class="box-role" fill="#FFFFFF">Workstream C Lead</text>
        <text x="937" y="227" text-anchor="middle" class="box-role" fill="#C780FF">Manager</text>
      </g>

      <!-- LEAF boxes (140x56) — y=310 -->
      <!-- Branch A: 2 leaves, centers 95 and 255 -->
      <g>
        <rect x="25" y="310" width="140" height="56" fill="#F8F4FC" stroke="#E5D5F0" stroke-width="1"/>
        <text x="95" y="335" text-anchor="middle" class="leaf-name">Priya Shah</text>
        <text x="95" y="352" text-anchor="middle" class="leaf-role">Senior Analyst</text>
      </g>
      <g>
        <rect x="185" y="310" width="140" height="56" fill="#F8F4FC" stroke="#E5D5F0" stroke-width="1"/>
        <text x="255" y="335" text-anchor="middle" class="leaf-name">Alex Novak</text>
        <text x="255" y="352" text-anchor="middle" class="leaf-role">Analyst</text>
      </g>

      <!-- Branch B: 3 leaves, centers 416, 556, 696 -->
      <g>
        <rect x="346" y="310" width="140" height="56" fill="#F8F4FC" stroke="#E5D5F0" stroke-width="1"/>
        <text x="416" y="335" text-anchor="middle" class="leaf-name">Sara Kim</text>
        <text x="416" y="352" text-anchor="middle" class="leaf-role">Associate</text>
      </g>
      <g>
        <rect x="486" y="310" width="140" height="56" fill="#F8F4FC" stroke="#E5D5F0" stroke-width="1"/>
        <text x="556" y="335" text-anchor="middle" class="leaf-name">Tom Becker</text>
        <text x="556" y="352" text-anchor="middle" class="leaf-role">Senior Analyst</text>
      </g>
      <g>
        <rect x="626" y="310" width="140" height="56" fill="#F8F4FC" stroke="#E5D5F0" stroke-width="1"/>
        <text x="696" y="335" text-anchor="middle" class="leaf-name">Lin Zhao</text>
        <text x="696" y="352" text-anchor="middle" class="leaf-role">Analyst</text>
      </g>

      <!-- Branch C: 2 leaves, centers 857 and 1017 -->
      <g>
        <rect x="787" y="310" width="140" height="56" fill="#F8F4FC" stroke="#E5D5F0" stroke-width="1"/>
        <text x="857" y="335" text-anchor="middle" class="leaf-name">Noah Ellis</text>
        <text x="857" y="352" text-anchor="middle" class="leaf-role">Associate</text>
      </g>
      <g>
        <rect x="947" y="310" width="140" height="56" fill="#F8F4FC" stroke="#E5D5F0" stroke-width="1"/>
        <text x="1017" y="335" text-anchor="middle" class="leaf-name">Ravi Iyer</text>
        <text x="1017" y="352" text-anchor="middle" class="leaf-role">Analyst</text>
      </g>
    </svg>
  </div>

  <div class="convergence" data-shape-id="convergence">Decisions escalate up the rail; signoffs come back the same way — no side channels.</div>
  <div class="footer-left" data-shape-id="footer-left"></div>
  <div class="footer-right" data-shape-id="footer-right"></div>
</body>
</html>
