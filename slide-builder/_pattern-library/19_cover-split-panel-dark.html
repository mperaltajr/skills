<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>19 · Cover slide — split panel (dark left / light right)</title>
<style>
:root {
  --brand-primary: #2D0A4E;
  --brand-primary-mid: #5C2D87;
  --brand-accent: #A100FF;
  --brand-accent-soft: #C780FF;
  --text-dark: #1A1A2E;
  --text-mid: #64748B;
  --text-faint: #94A3B8;
  --slide-bg: #FFFFFF;
  --card-bg: #F8F4FC;
  --card-border: #E5D5F0;
  --draft-bg: #FFD600;
  --draft-text: #B71C1C;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; background: var(--slide-bg); font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--text-dark); overflow: hidden; }
body { position: relative; }

/* Full-canvas split: two equal columns, no top/footer chrome (cover = bespoke) */
.cover { display: flex; flex-wrap: wrap; height: 100vh; }

/* ---------- LEFT PANEL: brand-primary fill, white text ---------- */
.left {
  background: var(--brand-primary);
  color: #FFFFFF;
  padding: 64px 64px 56px 64px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Subtle accent rule down the inner edge of the dark panel — ties to right panel axis */
.left::after {
  content: "";
  position: absolute;
  top: 64px;
  bottom: 56px;
  right: 0;
  width: 4px;
  background: var(--brand-accent);
}

.pre-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--brand-accent-soft);
  opacity: 0.85;
}

.title-block { margin-top: 0; }
.deck-title {
  font-size: 60px;
  font-weight: 800;
  line-height: 1.02;
  color: #FFFFFF;
  letter-spacing: -1.5px;
  margin-bottom: 18px;
}
.tagline {
  font-size: 19px;
  font-style: italic;
  color: var(--brand-accent-soft);
  font-weight: 400;
  letter-spacing: 0.2px;
}

.presented-by {
  border-top: 1px solid rgba(199, 128, 255, 0.25);
  padding-top: 18px;
  max-width: 360px;
}
.presented-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--brand-accent-soft);
  margin-bottom: 8px;
  opacity: 0.85;
}
.presented-name {
  font-size: 15px;
  font-weight: 600;
  color: #FFFFFF;
  line-height: 1.4;
}

/* ---------- RIGHT PANEL: dark background ---------- */
.right {
  background: #3A0D61;
  padding: 64px 64px 56px 64px;
  position: relative;
  display: flex;
  align-items: center;
}

/* Brand mark — small accent square top-right */
.brand-mark {
  position: absolute;
  top: 64px;
  right: 64px;
  width: 18px;
  height: 18px;
  background: var(--brand-accent);
}

/* Vertically centered meta block, anchored to a vertical accent rule */
.meta-wrap {
  display: flex;
  align-items: stretch;
  gap: 28px;
}
.meta-rule {
  width: 4px;
  background: var(--brand-accent);
  flex-shrink: 0;
}
.meta {
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding: 4px 0;
}
.meta-row { display: flex; flex-direction: column; gap: 4px; }
.meta-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
}
.meta-value {
  font-size: 17px;
  font-weight: 500;
  color: rgba(255,255,255,0.85);
  line-height: 1.3;
}
.meta-value.lead {
  font-size: 22px;
  font-weight: 700;
  color: #C780FF;
  letter-spacing: -0.2px;
}

/* Bottom-right: horizontal rule + DRAFT badge style */
.bottom-right {
  position: absolute;
  bottom: 56px;
  right: 64px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.bottom-rule-h {
  width: 64px;
  height: 2px;
  background: rgba(255,255,255,0.2);
}
.draft-badge {
  background: var(--draft-bg);
  color: var(--draft-text);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 14px;
  letter-spacing: 1.5px;
}

/* DARK THEME */
:root {
  --card-bg: rgba(255,255,255,0.07);
  --card-border: rgba(255,255,255,0.12);
  --text-dark: #FFFFFF;
  --text-mid: rgba(255,255,255,0.6);
  --text-faint: rgba(255,255,255,0.4);
  --slide-bg: #2D0A4E;
}
body, .slide { background: #2D0A4E; }
</style>
</head>
<body>
  <div class="cover">

    <!-- LEFT: dark brand-primary panel -->
    <div class="left" data-shape-id="cover-left-panel">
      <div class="pre-label" data-shape-id="cover-pre-label">Internal Deck &middot; 2026</div>

      <div class="title-block">
        <div class="deck-title" data-shape-id="cover-deck-title">Slide Lab</div>
        <div class="tagline" data-shape-id="cover-tagline">Think. Argue. Build.</div>
      </div>

      <div class="presented-by">
        <div class="presented-label" data-shape-id="cover-presented-label">Presented by</div>
        <div class="presented-name" data-shape-id="cover-presented-name">Mario Peralta &middot; Strategy Manager</div>
      </div>
    </div>

    <!-- RIGHT: dark meta panel -->
    <div class="right">
      <div class="brand-mark" data-shape-id="cover-brand-mark"></div>

      <div class="meta-wrap">
        <div class="meta-rule" data-shape-id="cover-meta-rule"></div>
        <div class="meta">
          <div class="meta-row">
            <div class="meta-label" data-shape-id="cover-meta-1-label">Prepared for</div>
            <div class="meta-value lead" data-shape-id="cover-meta-1-value">Internal &middot; Accenture Strategy</div>
          </div>
          <div class="meta-row">
            <div class="meta-label" data-shape-id="cover-meta-2-label">Date</div>
            <div class="meta-value" data-shape-id="cover-meta-2-value">May 2026</div>
          </div>
          <div class="meta-row">
            <div class="meta-label" data-shape-id="cover-meta-3-label">Duration</div>
            <div class="meta-value" data-shape-id="cover-meta-3-value">30 minutes</div>
          </div>
        </div>
      </div>

      <div class="bottom-right">
        <div class="bottom-rule-h" data-shape-id="cover-bottom-rule"></div>
      </div>
    </div>

  </div>
</body>
</html>
