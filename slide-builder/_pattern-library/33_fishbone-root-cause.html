<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>33 · Fishbone root cause</title>
<style>
:root {
  --brand-primary: #2D0A4E;
  --brand-primary-mid: #5C2D87;
  --brand-accent: #A100FF;
  --brand-accent-soft: #C780FF;
  --text-dark: #1A1A2E;
  --text-mid: #64748B;
  --text-faint: #94A3B8;
  --slide-bg: #FFFFFF;
  --card-bg: #F8F4FC;
  --card-border: #E5D5F0;
  --draft-bg: #FFD600;
  --draft-text: #B71C1C;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; background: var(--slide-bg); font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--text-dark); overflow: hidden; }
body { padding: 50px 64px 80px 64px; position: relative; }
.draft-badge { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: var(--draft-bg); color: var(--draft-text); font-size: 11px; font-weight: 700; padding: 4px 16px; letter-spacing: 1px; }
.project-label { position: absolute; top: 24px; left: 24px; color: var(--text-faint); font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }

/* ---- Title block ---- */
.action-title { position: absolute; left: 64px; right: 64px; top: 28px; min-height: 72px; font-size: 28px; font-weight: 700; line-height: 1.2; max-width: 1050px; }
.action-title strong { color: var(--brand-primary); }
.subhead { position: absolute; left: 64px; right: 64px; top: 100px; font-size: 14px; color: var(--text-mid); font-style: italic; }
.title-rule { position: absolute; left: 64px; top: 128px; width: 40px; height: 3px; background: var(--brand-accent); }

/* ---- Fishbone canvas: SVG drives geometry ---- */
.chart-block {
  position: absolute;
  left: 64px;
  right: 64px;
  top: 200px;
  bottom: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.chart-svg {
  width: 100%;
  height: 100%;
  display: block;
}
.chart-svg text { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }

.effect-text { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
.category-label { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: var(--brand-primary-mid); }
.subcause-text { font-size: 10.5px; font-weight: 500; fill: var(--text-mid); }
.spine-label { font-size: 9px; font-weight: 700; letter-spacing: 1.2px; fill: var(--text-faint); }

/* ---- Convergence strip ---- */
.convergence {
  position: absolute;
  left: 64px;
  right: 64px;
  bottom: 70px;
  background: var(--brand-primary);
  color: white;
  padding: 12px 22px;
  font-size: 14px;
  font-style: italic;
  font-weight: 500;
}

/* ---- Footer invariant ---- */
.footer-rule { position: absolute; left: 0; right: 0; bottom: 32px; height: 1px; background: var(--card-border); }
.footer-left { position: absolute; bottom: 14px; left: 24px; color: var(--text-faint); font-size: 11px; letter-spacing: 1px; }
.footer-right { position: absolute; bottom: 14px; right: 24px; color: var(--text-faint); font-size: 11px; }
</style>
</head>
<body>

  <div class="action-title" data-shape-id="title">Why decks degrade — <strong>six categories of root cause</strong>.</div>
  <div class="subhead" data-shape-id="subtitle">Six categories of root causes. The one we own is the structural process — that's where we can act.</div>
  <div class="title-rule" data-shape-id="brand-rule"></div>

  <div class="chart-block">
    <!--
      SVG viewBox 1152 x 405

      SPINE: horizontal arrow on y=202, x=60 -> x=900 (tip at x=900)
      EFFECT BOX: x=900, y=142, w=228, h=120  (right edge at 1128)

      TOP-BONE landing points on spine:    x = 200, 420, 640
      BOTTOM-BONE landing points on spine: x = 310, 530, 750

      Each top bone:    starts at (lx, 30),  ends at (sx, 202)   — slope down-right
      Each bottom bone: starts at (lx, 374), ends at (sx, 202)   — slope up-right

      To keep equal angles, set horizontal offset = 90 for every bone.
        Top bone:    (sx - 90, 30) -> (sx, 202)
        Bottom bone: (sx - 90, 374) -> (sx, 202)

      Top bones outer ends:    (110, 30),  (330, 30),  (550, 30)
      Bottom bones outer ends: (220, 374), (440, 374), (660, 374)

      Category label sits just above (top) or below (bottom) the outer end of the bone.
      Sub-causes are stacked next to the bone, on the inside (toward spine), in 3 short lines.
    -->
    <svg class="chart-svg" viewBox="0 0 1152 405" preserveAspectRatio="xMidYMid meet" data-shape-id="chart-canvas">

      <!-- Arrow marker for spine tip -->
      <defs>
        <marker id="spine-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D0A4E"/>
        </marker>
      </defs>

      <!-- ===== Bones (drawn first so spine + effect sit on top) ===== -->
      <g stroke="#5C2D87" stroke-width="2" fill="none" stroke-linecap="square">
        <!-- Top bones: down-right onto spine -->
        <line x1="110" y1="30"  x2="200" y2="202"/>
        <line x1="330" y1="30"  x2="420" y2="202"/>
        <line x1="550" y1="30"  x2="640" y2="202"/>
        <!-- Bottom bones: up-right onto spine -->
        <line x1="220" y1="374" x2="310" y2="202"/>
        <line x1="440" y1="374" x2="530" y2="202"/>
        <line x1="660" y1="374" x2="750" y2="202"/>
      </g>

      <!-- ===== Spine (thick brand-primary arrow pointing right into EFFECT) ===== -->
      <line x1="60" y1="202" x2="898" y2="202"
            stroke="#2D0A4E" stroke-width="6" stroke-linecap="square"
            marker-end="url(#spine-arrow)"/>

      <!-- ===== EFFECT box =====
           Box: x=900..1128 (w=228), y=142..262 (h=120), center x=1014.
           Padding budget: ~18px on every side.
             - Top padding 18px  → eyebrow baseline y=164 (cap-height sits ~y=154, ≈12px from top edge of box at y=142, plus a couple px optical = ~18px)
             - Bottom padding 18px → last body line baseline y=240 (descender sits ~y=243, ≈19px from bottom edge of box at y=262)
             - Eyebrow → body gap: 22px (clear separation between label and statement)
             - Body line-height: 18px (consistent inter-line rhythm)
      -->
      <g>
        <rect x="900" y="142" width="228" height="120" fill="#2D0A4E"/>
        <text x="1014" y="164" text-anchor="middle" class="effect-text" style="letter-spacing:1.2px; font-size:10px; fill:#C780FF;">EFFECT</text>
        <text x="1014" y="186" text-anchor="middle" class="effect-text">Decks degrade over</text>
        <text x="1014" y="204" text-anchor="middle" class="effect-text">the engagement</text>
        <text x="1014" y="222" text-anchor="middle" class="effect-text">instead of getting</text>
        <text x="1014" y="240" text-anchor="middle" class="effect-text">sharper</text>
      </g>

      <!-- ============================================================
           TOP BONES — categories above, sub-causes stacked inside the V
           ============================================================ -->

      <!-- TOP 1: METHOD  (outer end 110,30) -->
      <g>
        <text x="110" y="18" text-anchor="middle" class="category-label">METHOD</text>
        <text x="158" y="60"  class="subcause-text">No standard process</text>
        <text x="180" y="78"  class="subcause-text">Pre-reads optional</text>
        <text x="202" y="96"  class="subcause-text">Edits unstructured</text>
      </g>

      <!-- TOP 2: PEOPLE (outer end 330,30) -->
      <g>
        <text x="330" y="18" text-anchor="middle" class="category-label">PEOPLE</text>
        <text x="378" y="60"  class="subcause-text">Reviewers add, don't subtract</text>
        <text x="400" y="78"  class="subcause-text">Authors defer to seniority</text>
        <text x="422" y="96"  class="subcause-text">Juniors can't push back</text>
      </g>

      <!-- TOP 3: TOOLS (outer end 550,30) -->
      <g>
        <text x="550" y="18" text-anchor="middle" class="category-label">TOOLS</text>
        <text x="598" y="60"  class="subcause-text">Generic AI lacks discipline</text>
        <text x="620" y="78"  class="subcause-text">Cycle time not measured</text>
        <text x="642" y="96"  class="subcause-text">Templates inconsistent</text>
      </g>

      <!-- ============================================================
           BOTTOM BONES — categories below, sub-causes stacked inside V
           ============================================================ -->

      <!-- BOT 1: INPUTS (outer end 220,374) -->
      <g>
        <text x="220" y="394" text-anchor="middle" class="category-label">INPUTS</text>
        <text x="268" y="350" class="subcause-text">Findings unfiltered</text>
        <text x="290" y="332" class="subcause-text">Stakeholder asks accumulate</text>
        <text x="312" y="314" class="subcause-text">Scope creep mid-engagement</text>
      </g>

      <!-- BOT 2: ENVIRONMENT (outer end 440,374) -->
      <g>
        <text x="440" y="394" text-anchor="middle" class="category-label">ENVIRONMENT</text>
        <text x="488" y="350" class="subcause-text">Time pressure</text>
        <text x="510" y="332" class="subcause-text">Distributed teams</text>
        <text x="532" y="314" class="subcause-text">Late-night edits</text>
      </g>

      <!-- BOT 3: MEASUREMENT (outer end 660,374) -->
      <g>
        <text x="660" y="394" text-anchor="middle" class="category-label">MEASUREMENT</text>
        <text x="708" y="350" class="subcause-text">No baseline</text>
        <text x="730" y="332" class="subcause-text">Edits not tracked</text>
        <text x="752" y="314" class="subcause-text">Quality not defined</text>
      </g>

    </svg>
  </div>

  <div class="convergence" data-shape-id="convergence">Six categories of root causes. The one we own is the structural process — that's where we can act.</div>
  <div class="footer-left" data-shape-id="footer-left"></div>
  <div class="footer-right" data-shape-id="footer-right"></div>
</body>
</html>
