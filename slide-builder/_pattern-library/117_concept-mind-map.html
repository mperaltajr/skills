<style>
:root {
  --brand-primary: #2D0A4E;
  --brand-primary-mid: #5C2D87;
  --brand-accent: #A100FF;
  --brand-accent-soft: #C780FF;
  --text-dark: #1A1A2E;
  --text-mid: #64748B;
  --text-faint: #94A3B8;
  --slide-bg: #FFFFFF;
  --card-bg: #F8F4FC;
  --card-border: #E5D5F0;
  --draft-bg: #FFD600;
  --draft-text: #B71C1C;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #4a4a4a;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Inter', sans-serif;
  margin: 0;
  padding: 24px;
  box-sizing: border-box;
}
.slide {
  width: 1280px;
  height: 720px;
  position: relative;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 12px 48px rgba(0,0,0,0.35);
}

/* Top chrome */
.accenture-tag {
  position: absolute;
  top: 24px;
  left: 24px;
  font-size: 10px;
  color: var(--text-faint);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  z-index: 5;
}

/* DRAFT badge */
.draft-badge {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--draft-bg);
  color: var(--draft-text);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 16px;
  letter-spacing: 1px;
  text-transform: uppercase;
  z-index: 5;
  /* NO border-radius */
}

/* Title block */
.title-block {
  position: absolute;
  top: 48px;
  left: 48px;
  right: 48px;
}
.title-block h1 {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--text-dark);
  letter-spacing: -0.01em;
}
.title-block h1 strong {
  color: var(--brand-primary);
}
.subhead {
  font-size: 12.5px;
  color: var(--text-mid);
  margin-top: 6px;
  font-style: italic;
  line-height: 1.4;
}
.title-rule {
  width: 48px;
  height: 3px;
  background: var(--brand-accent);
  margin-top: 10px;
}

/* Mind map SVG area */
.mind-map-area {
  position: absolute;
  top: 145px;
  left: 0;
  right: 0;
  bottom: 32px;
}
.mind-map-area svg {
  width: 100%;
  height: 100%;
  font-family: 'Inter', sans-serif;
  overflow: visible;
}

/* Footer */
.footer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 28px;
  display: flex;
  align-items: center;
  padding: 0 48px;
  font-size: 9.5px;
  color: var(--text-faint);
  letter-spacing: 1px;
  text-transform: uppercase;
  border-top: 1px solid var(--card-border);
  background: #FBFAFD;
}
.footer-right {
  margin-left: auto;
}
</style>
</head>
