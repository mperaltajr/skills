<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Pattern 176 — Cover: Minimalist Type-Only</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-primary: #2D0A4E;
    --brand-primary-mid: #5C2D87;
    --brand-accent: #A100FF;
    --brand-accent-soft: #C780FF;
    --text-dark: #1A1A2E;
    --text-mid: #64748B;
    --text-faint: #94A3B8;
    --slide-bg: #FFFFFF;
    --card-bg: #F8F4FC;
    --card-border: #E5D5F0;
    --draft-bg: #FFD600;
    --draft-text: #B71C1C;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: Inter, system-ui, sans-serif;
    background: var(--slide-bg);
    position: relative;
  }

  /* ── Invariant Chrome ── */

  .project-label {
    position: absolute;
    top: 24px;
    left: 24px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--text-faint);
    text-transform: uppercase;
  }

  .draft-badge {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--draft-bg);
    color: var(--draft-text);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 16px;
    border-radius: 0;
  }

  .footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    border-top: 1px solid var(--card-border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 20px 10px;
  }

  .footer-left,
  .footer-right {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }

  /* ── Content ── */

  .slide-body {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 56px; /* above footer */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .center-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .rule-top {
    width: 120px;
    height: 2px;
    background: var(--brand-accent);
    margin-bottom: 32px;
  }

  .title {
    font-size: 56px;
    font-weight: 700;
    color: var(--brand-primary);
    max-width: 800px;
    text-align: center;
    line-height: 1.15;
    margin-bottom: 28px;
  }

  .title strong {
    color: var(--brand-accent);
    font-weight: 700;
  }

  .rule-bottom {
    width: 80px;
    height: 3px;
    background: var(--brand-accent);
    margin-bottom: 28px;
  }

  .subtitle {
    font-size: 18px;
    font-style: italic;
    color: var(--text-mid);
    text-align: center;
    margin-bottom: 24px;
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .client-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--brand-primary-mid);
    letter-spacing: 0.02em;
  }

  .meta-sep {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text-faint);
  }

  .date {
    font-size: 14px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

  <!-- Invariant Chrome -->
  <span class="project-label" data-shape-id="accenture-tag">ACCENTURE INTERNAL</span>

  <!-- Content -->
  <div class="slide-body">
    <div class="center-block">
      <div class="rule-top" data-shape-id="cover-rule-top"></div>

      <h1 class="title" data-shape-id="cover-deck-title">
        A <strong>Focused</strong> Approach to Transforming Enterprise Performance
      </h1>

      <div class="rule-bottom" data-shape-id="cover-rule-bottom"></div>

      <p class="subtitle" data-shape-id="cover-tagline">Strategic Priorities and Path to Value Creation</p>

      <div class="meta">
        <span class="client-name" data-shape-id="cover-client-name">Client Name</span>
        <div class="meta-sep" data-shape-id="cover-meta-sep"></div>
        <span class="date" data-shape-id="cover-date">May 2026</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-left" data-shape-id="footer-left">CONFIDENTIAL — ACCENTURE INTERNAL</span>
    <span class="footer-right" data-shape-id="footer-right">Slide Lab · 2026 · 176</span>
  </footer>

</body>
</html>
