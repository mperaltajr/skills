<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>29 · Decision tree</title>
<style>
:root {
  --brand-primary: #2D0A4E;
  --brand-primary-mid: #5C2D87;
  --brand-accent: #A100FF;
  --brand-accent-soft: #C780FF;
  --text-dark: #1A1A2E;
  --text-mid: #64748B;
  --text-faint: #94A3B8;
  --slide-bg: #FFFFFF;
  --card-bg: #F8F4FC;
  --card-border: #E5D5F0;
  --draft-bg: #FFD600;
  --draft-text: #B71C1C;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; background: var(--slide-bg); font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--text-dark); overflow: hidden; }
body { padding: 50px 64px 80px 64px; position: relative; }
.draft-badge { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: var(--draft-bg); color: var(--draft-text); font-size: 11px; font-weight: 700; padding: 4px 16px; letter-spacing: 1px; }
.project-label { position: absolute; top: 24px; left: 24px; color: var(--text-faint); font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }

/* ---- Title block ---- */
.action-title { font-size: 28px; font-weight: 700; line-height: 1.2; max-width: 1050px; }
.action-title strong { color: var(--brand-primary); }
.subhead { font-size: 14px; color: var(--text-mid); margin-top: 10px; font-style: italic; }
.title-rule { width: 56px; height: 3px; background: var(--brand-accent); margin: 18px 0 0 0; }

/* ---- Tree canvas: SVG drives geometry ---- */
.chart-block {
  position: absolute;
  left: 64px;
  right: 64px;
  top: 200px;
  bottom: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.chart-svg {
  width: 100%;
  height: 100%;
  display: block;
}
.chart-svg text { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; }

.root-text { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
.decision-text { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
.leaf-text { font-size: 12px; font-weight: 700; fill: var(--brand-primary); }
.leaf-text-sub { font-size: 11px; font-weight: 500; fill: var(--text-mid); }
.edge-label-bg { fill: #FFFFFF; }
.edge-label { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; fill: var(--brand-accent); }

/* ---- Convergence strip ---- */
.convergence {
  position: absolute;
  left: 64px;
  right: 64px;
  bottom: 70px;
  background: var(--brand-primary);
  color: white;
  padding: 12px 22px;
  font-size: 13px;
  font-style: italic;
  font-weight: 500;
}

/* ---- Footer invariant ---- */
.footer-rule { position: absolute; left: 0; right: 0; bottom: 32px; height: 1px; background: var(--card-border); }
.footer-left { position: absolute; bottom: 14px; left: 24px; color: var(--text-faint); font-size: 10px; letter-spacing: 1px; }
.footer-right { position: absolute; bottom: 14px; right: 24px; color: var(--text-faint); font-size: 11px; }

/* DARK THEME */
:root {
  --card-bg: rgba(255,255,255,0.07);
  --card-border: rgba(255,255,255,0.12);
  --text-dark: #FFFFFF;
  --text-mid: rgba(255,255,255,0.6);
  --slide-bg: #2D0A4E;
}
body, .slide { background: #2D0A4E; }
.project-label { color: rgba(255,255,255,0.4); }
.action-title { color: #FFFFFF; }
.action-title strong { color: #C780FF; }
.subhead { color: rgba(255,255,255,0.6); }
.leaf-text { fill: #FFFFFF; }
.leaf-text-sub { fill: rgba(255,255,255,0.6); }
.edge-label-bg { fill: #2D0A4E; }
.footer-rule { background: rgba(255,255,255,0.1); }
.footer-left, .footer-right { color: rgba(255,255,255,0.4); }
</style>
</head>
<body>
  <div class="project-label" data-shape-id="accenture-tag">ACCENTURE INTERNAL</div>
  <div class="draft-badge" data-shape-id="draft-badge">DRAFT</div>

  <div class="action-title" data-shape-id="title">The routing decision — <strong>when to draft, when to coach first</strong>.</div>
  <div class="subhead" data-shape-id="subtitle">One question at the top of every deck. Four outcomes at the bottom. No ambiguity in between.</div>
  <div class="title-rule" data-shape-id="brand-rule"></div>

  <div class="chart-block">
    <svg class="chart-svg" data-shape-id="chart-canvas" viewBox="0 0 1152 420" preserveAspectRatio="xMidYMid meet">

      <!-- ===== Connectors (drawn first, nodes on top) ===== -->
      <g stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none" stroke-linecap="square">
        <!-- Root down to decision rail -->
        <line x1="576" y1="70"  x2="576" y2="120"/>
        <!-- Decision rail -->
        <line x1="288" y1="120" x2="864" y2="120"/>
        <!-- Stubs from rail down to decision nodes -->
        <line x1="288" y1="120" x2="288" y2="135"/>
        <line x1="864" y1="120" x2="864" y2="135"/>

        <!-- Left decision down to its leaf rail -->
        <line x1="288" y1="195" x2="288" y2="225"/>
        <line x1="144" y1="225" x2="432" y2="225"/>
        <line x1="144" y1="225" x2="144" y2="275"/>
        <line x1="432" y1="225" x2="432" y2="275"/>

        <!-- Right decision down to its leaf rail -->
        <line x1="864" y1="195" x2="864" y2="225"/>
        <line x1="720" y1="225" x2="1008" y2="225"/>
        <line x1="720" y1="225" x2="720" y2="275"/>
        <line x1="1008" y1="225" x2="1008" y2="275"/>
      </g>

      <!-- ===== Edge labels — uniform 80x18 pills ===== -->
      <g>
        <rect x="392" y="111" width="80" height="18" class="edge-label-bg"/>
        <text x="432" y="124" text-anchor="middle" class="edge-label">YES</text>
      </g>
      <g>
        <rect x="680" y="111" width="80" height="18" class="edge-label-bg"/>
        <text x="720" y="124" text-anchor="middle" class="edge-label">NO</text>
      </g>
      <g>
        <rect x="176" y="216" width="80" height="18" class="edge-label-bg"/>
        <text x="216" y="229" text-anchor="middle" class="edge-label">YES</text>
      </g>
      <g>
        <rect x="320" y="216" width="80" height="18" class="edge-label-bg"/>
        <text x="360" y="229" text-anchor="middle" class="edge-label">NO</text>
      </g>
      <g>
        <rect x="752" y="216" width="80" height="18" class="edge-label-bg"/>
        <text x="792" y="229" text-anchor="middle" class="edge-label">QUESTION</text>
      </g>
      <g>
        <rect x="896" y="216" width="80" height="18" class="edge-label-bg"/>
        <text x="936" y="229" text-anchor="middle" class="edge-label">SCOPE</text>
      </g>

      <!-- ===== ROOT node (280x60) ===== -->
      <g>
        <rect x="436" y="10" width="280" height="60" fill="#A100FF"/>
        <text x="576" y="35" text-anchor="middle" class="root-text">Is the governing</text>
        <text x="576" y="55" text-anchor="middle" class="root-text">thought clear?</text>
      </g>

      <!-- ===== DECISION nodes (220x60) ===== -->
      <g>
        <rect x="178" y="135" width="220" height="60" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="288" y="160" text-anchor="middle" class="decision-text">Enough evidence</text>
        <text x="288" y="180" text-anchor="middle" class="decision-text">to draft now?</text>
      </g>
      <g>
        <rect x="754" y="135" width="220" height="60" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="864" y="160" text-anchor="middle" class="decision-text">What's unclear —</text>
        <text x="864" y="180" text-anchor="middle" class="decision-text">question or scope?</text>
      </g>

      <!-- ===== LEAF nodes (240x88) ===== -->
      <!-- Leaf 1: YES/YES -->
      <g>
        <rect x="24" y="275" width="240" height="88" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="144" y="305" text-anchor="middle" class="leaf-text">Draft directly</text>
        <text x="144" y="325" text-anchor="middle" class="leaf-text-sub">Start with the action title;</text>
        <text x="144" y="345" text-anchor="middle" class="leaf-text-sub">build slides from the spine.</text>
      </g>
      <!-- Leaf 2: YES/NO -->
      <g>
        <rect x="312" y="275" width="240" height="88" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="432" y="305" text-anchor="middle" class="leaf-text">Gather one more data point</text>
        <text x="432" y="325" text-anchor="middle" class="leaf-text-sub">One number, one quote, one</text>
        <text x="432" y="345" text-anchor="middle" class="leaf-text-sub">chart — then return and draft.</text>
      </g>
      <!-- Leaf 3: NO/QUESTION -->
      <g>
        <rect x="600" y="275" width="240" height="88" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="720" y="305" text-anchor="middle" class="leaf-text">Sharpen the question</text>
        <text x="720" y="325" text-anchor="middle" class="leaf-text-sub">Run a coaching session</text>
        <text x="720" y="345" text-anchor="middle" class="leaf-text-sub">before any slide is built.</text>
      </g>
      <!-- Leaf 4: NO/SCOPE -->
      <g>
        <rect x="888" y="275" width="240" height="88" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="1008" y="305" text-anchor="middle" class="leaf-text">Reframe the scope</text>
        <text x="1008" y="325" text-anchor="middle" class="leaf-text-sub">Realign with the partner</text>
        <text x="1008" y="345" text-anchor="middle" class="leaf-text-sub">before drafting any slide.</text>
      </g>
    </svg>
  </div>

  <div class="convergence" data-shape-id="convergence">Every deck starts with the same question. Most of them don't.</div>

  <div class="footer-rule" data-shape-id="footer-rule"></div>
  <div class="footer-left" data-shape-id="footer-left">CONFIDENTIAL — ACCENTURE INTERNAL</div>
  <div class="footer-right" data-shape-id="footer-right">Slide Lab · 2026 · 29d</div>
</body>
</html>
