<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>273 · Force field analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --brand-primary: #2D0A4E;
  --brand-primary-mid: #5C2D87;
  --brand-accent: #A100FF;
  --brand-accent-soft: #C780FF;
  --text-dark: #1A1A2E;
  --text-mid: #64748B;
  --text-faint: #94A3B8;
  --slide-bg: #FFFFFF;
  --card-bg: #F8F4FC;
  --card-border: #E5D5F0;
  --draft-bg: #FFD600;
  --draft-text: #B71C1C;
  --driving-fill: #16A34A;
  --driving-fill-soft: #DCFCE7;
  --restraining-fill: #DC2626;
  --restraining-fill-soft: #FEE2E2;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1280px; height: 720px;
  background: var(--slide-bg);
  font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  color: var(--text-dark);
  overflow: hidden;
}
body { position: relative; }

/* ── Chrome ── */
.project-label {
  position: absolute; top: 18px; left: 24px;
  color: var(--text-faint); font-size: 9px; font-weight: 600;
  letter-spacing: 0.15em; text-transform: uppercase;
}
.draft-badge {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  background: var(--draft-bg); color: var(--draft-text);
  font-size: 11px; font-weight: 700; padding: 4px 18px; letter-spacing: 1px;
}

/* ── Title block ── */
.title-block {
  position: absolute; top: 44px; left: 56px; right: 56px;
}
.action-title {
  font-size: 29px; font-weight: 700; line-height: 1.2; color: var(--brand-primary);
}
.action-title strong { color: var(--brand-accent); }
.subhead {
  font-size: 13px; color: var(--text-mid); margin-top: 8px; font-style: italic;
}
.title-rule { width: 64px; height: 3px; background: var(--brand-accent); margin-top: 12px; }

/* ── Footer ── */
.footer {
  position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
  border-top: 1px solid var(--card-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  font-size: 9px; color: var(--text-faint);
}

/* ── Content area (SVG wrapper) ── */
.content-area {
  position: absolute;
  top: 152px;
  left: 56px;
  right: 56px;
  bottom: 36px;
}
.content-area svg {
  width: 100%; height: 100%;
  display: block;
  overflow: visible;
}
</style>
</head>
<body>

<!-- Chrome -->
<span class="project-label">Accenture Internal</span>
<span class="draft-badge">DRAFT</span>

<!-- Title block -->
<div class="title-block">
  <div class="action-title">Force Field Analysis: <strong>Procurement Transformation</strong></div>
  <div class="subhead">Driving vs. restraining forces — Centre-Led Procurement Model implementation readiness</div>
  <div class="title-rule"></div>
</div>

<!-- SVG content area -->
<div class="content-area">
<!--
  Content area dimensions: 1168 × 532px (1280-112 wide, 720-152-36 tall)
  We use a viewBox that matches, so all coordinates are in px-equivalent.

  Layout:
    viewBox="0 0 1168 532"
    Center bar: x=564, width=40, full height (y=0 to y=532)
    Left half  (driving):  x=0   to x=564
    Right half (restraining): x=604 to x=1168

  Arrow rows: 5 rows, evenly spaced inside the content area minus header rows.
    Header row height: 26px at top
    Net balance strip: 38px at bottom (y=494 to y=532)
    Arrow area: y=32 to y=490 → 458px for 5 rows → row height = 91.6px

  Arrow dimensions:
    Max score = 5. Max arrow length = 220px.
    Arrow length = (score/5) * 220
    Arrow height (body) = 28px
    Arrowhead: triangle 18px wide, 18px tall (adds to length)

  Driving arrows grow LEFT→RIGHT from x=10 toward center bar (x=564).
    Arrow tip touches center bar at x=564.
    Arrow tail starts at x = 564 - arrow_length

  Restraining arrows grow RIGHT→LEFT from x=1158 toward center bar (x=604).
    Arrow tip touches center bar at x=604.
    Arrow tail starts at x = 604 + arrow_length
-->
<svg viewBox="0 0 1168 532" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <!-- Driving arrowhead (points right) -->
    <marker id="arrowR" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#16A34A"/>
    </marker>
    <!-- Restraining arrowhead (points left) -->
    <marker id="arrowL" markerWidth="10" markerHeight="8" refX="0" refY="4" orient="auto">
      <polygon points="10 0, 0 4, 10 8" fill="#DC2626"/>
    </marker>
  </defs>

  <!-- ── Background tints ── -->
  <rect x="0" y="0" width="564" height="494" fill="#F0FDF4" rx="0"/>
  <rect x="604" y="0" width="564" height="494" fill="#FEF2F2" rx="0"/>

  <!-- ── Section headers ── -->
  <text x="12" y="21" font-size="12" font-weight="800" letter-spacing="2" fill="#16A34A" text-anchor="start">DRIVING FORCES</text>
  <text x="1156" y="21" font-size="12" font-weight="800" letter-spacing="2" fill="#DC2626" text-anchor="end">RESTRAINING FORCES</text>

  <!-- ── Center bar ── -->
  <rect x="564" y="0" width="40" height="494" fill="#2D0A4E"/>
  <!-- Rotated label inside center bar -->
  <text
    x="584" y="247"
    font-size="13" font-weight="700" fill="white"
    text-anchor="middle"
    transform="rotate(-90, 584, 247)"
    letter-spacing="1.5"
  >Implement Centre-Led Procurement Model</text>

  <!--
    Arrow rows:
    Usable area: y=30 to y=490 = 460px
    5 rows: row_h = 92px
    Row centers: 30 + 46 = 76, 168, 260, 352, 444
  -->

  <!-- ═══════════════════════════════════════
       DRIVING FORCES (left side, arrows →)
       Max length = 220px at score 5.
       tip always at x=564, tail at x=564-length

       Score circles sit at x=554 (just inside tip, nudge left of bar)
       Label sits right-aligned at tail minus a gap

       Row 1: Executive mandate from CEO — score 5 → length 220
       Row 2: Proven $14M savings case   — score 4 → length 176
       Row 3: Team capability in place   — score 4 → length 176
       Row 4: Regulatory compliance      — score 3 → length 132
       Row 5: Benchmark peer adoption    — score 3 → length 132
  ═══════════════════════════════════════ -->

  <!-- Row 1: score 5, length 220, center y=76 -->
  <!-- Arrow body rect -->
  <rect x="344" y="62" width="220" height="28" fill="#16A34A" rx="2"/>
  <!-- Arrow tip polygon (right-pointing triangle at x=564) -->
  <polygon points="564,56 582,76 564,96" fill="#16A34A"/>
  <!-- Label -->
  <text x="338" y="80" font-size="12" font-weight="600" fill="#14532D" text-anchor="end">Executive mandate from CEO</text>
  <!-- Score circle -->
  <circle cx="554" cy="76" r="11" fill="#14532D"/>
  <text x="554" y="80" font-size="12" font-weight="700" fill="white" text-anchor="middle">5</text>

  <!-- Row 2: score 4, length 176, center y=168 -->
  <rect x="388" y="154" width="176" height="28" fill="#16A34A" rx="2" opacity="0.85"/>
  <polygon points="564,148 582,168 564,188" fill="#16A34A" opacity="0.85"/>
  <text x="382" y="172" font-size="12" font-weight="600" fill="#14532D" text-anchor="end">Proven $14M savings case</text>
  <circle cx="554" cy="168" r="11" fill="#14532D"/>
  <text x="554" y="172" font-size="12" font-weight="700" fill="white" text-anchor="middle">4</text>

  <!-- Row 3: score 4, length 176, center y=260 -->
  <rect x="388" y="246" width="176" height="28" fill="#16A34A" rx="2" opacity="0.85"/>
  <polygon points="564,240 582,260 564,280" fill="#16A34A" opacity="0.85"/>
  <text x="382" y="264" font-size="12" font-weight="600" fill="#14532D" text-anchor="end">Team capability in place</text>
  <circle cx="554" cy="260" r="11" fill="#14532D"/>
  <text x="554" y="264" font-size="12" font-weight="700" fill="white" text-anchor="middle">4</text>

  <!-- Row 4: score 3, length 132, center y=352 -->
  <rect x="432" y="338" width="132" height="28" fill="#16A34A" rx="2" opacity="0.7"/>
  <polygon points="564,332 582,352 564,372" fill="#16A34A" opacity="0.7"/>
  <text x="426" y="356" font-size="12" font-weight="600" fill="#14532D" text-anchor="end">Regulatory compliance driver</text>
  <circle cx="554" cy="352" r="11" fill="#14532D" opacity="0.8"/>
  <text x="554" y="356" font-size="12" font-weight="700" fill="white" text-anchor="middle">3</text>

  <!-- Row 5: score 3, length 132, center y=444 -->
  <rect x="432" y="430" width="132" height="28" fill="#16A34A" rx="2" opacity="0.7"/>
  <polygon points="564,424 582,444 564,464" fill="#16A34A" opacity="0.7"/>
  <text x="426" y="448" font-size="12" font-weight="600" fill="#14532D" text-anchor="end">Benchmark peer adoption</text>
  <circle cx="554" cy="444" r="11" fill="#14532D" opacity="0.8"/>
  <text x="554" y="448" font-size="12" font-weight="700" fill="white" text-anchor="middle">3</text>

  <!-- ═══════════════════════════════════════
       RESTRAINING FORCES (right side, arrows ←)
       tip at x=604, tail at x=604+length
       Score circles at x=614 (just inside tip, nudge right of bar)
       Labels left-aligned at tail + gap

       Row 1: Change resistance from BU heads — score 4 → length 176
       Row 2: Existing vendor relationships  — score 3 → length 132
       Row 3: IT system fragmentation        — score 4 → length 176
       Row 4: Short-term cost of transition  — score 3 → length 132
       Row 5: Lack of data standards         — score 2 → length 88
  ═══════════════════════════════════════ -->

  <!-- Row 1: score 4, length 176, center y=76 -->
  <rect x="604" y="62" width="176" height="28" fill="#DC2626" rx="2" opacity="0.85"/>
  <polygon points="604,56 586,76 604,96" fill="#DC2626" opacity="0.85"/>
  <text x="786" y="80" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="start">Change resistance from BU heads</text>
  <circle cx="614" cy="76" r="11" fill="#7F1D1D"/>
  <text x="614" y="80" font-size="12" font-weight="700" fill="white" text-anchor="middle">4</text>

  <!-- Row 2: score 3, length 132, center y=168 -->
  <rect x="604" y="154" width="132" height="28" fill="#DC2626" rx="2" opacity="0.7"/>
  <polygon points="604,148 586,168 604,188" fill="#DC2626" opacity="0.7"/>
  <text x="742" y="172" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="start">Existing vendor relationships</text>
  <circle cx="614" cy="168" r="11" fill="#7F1D1D" opacity="0.85"/>
  <text x="614" y="172" font-size="12" font-weight="700" fill="white" text-anchor="middle">3</text>

  <!-- Row 3: score 4, length 176, center y=260 -->
  <rect x="604" y="246" width="176" height="28" fill="#DC2626" rx="2" opacity="0.85"/>
  <polygon points="604,240 586,260 604,280" fill="#DC2626" opacity="0.85"/>
  <text x="786" y="264" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="start">IT system fragmentation</text>
  <circle cx="614" cy="260" r="11" fill="#7F1D1D"/>
  <text x="614" y="264" font-size="12" font-weight="700" fill="white" text-anchor="middle">4</text>

  <!-- Row 4: score 3, length 132, center y=352 -->
  <rect x="604" y="338" width="132" height="28" fill="#DC2626" rx="2" opacity="0.7"/>
  <polygon points="604,332 586,352 604,372" fill="#DC2626" opacity="0.7"/>
  <text x="742" y="356" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="start">Short-term cost of transition</text>
  <circle cx="614" cy="352" r="11" fill="#7F1D1D" opacity="0.85"/>
  <text x="614" y="356" font-size="12" font-weight="700" fill="white" text-anchor="middle">3</text>

  <!-- Row 5: score 2, length 88, center y=444 -->
  <rect x="604" y="430" width="88" height="28" fill="#DC2626" rx="2" opacity="0.55"/>
  <polygon points="604,424 586,444 604,464" fill="#DC2626" opacity="0.55"/>
  <text x="698" y="448" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="start">Lack of data standards</text>
  <circle cx="614" cy="444" r="11" fill="#7F1D1D" opacity="0.65"/>
  <text x="614" y="448" font-size="12" font-weight="700" fill="white" text-anchor="middle">2</text>

  <!-- ── Net force balance strip ── -->
  <rect x="0" y="494" width="1168" height="38" fill="#2D0A4E" rx="0"/>
  <text x="584" y="518" font-size="12" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.5">
    NET FORCE BALANCE:
    <tspan fill="#86EFAC"> DRIVING 19</tspan>
    <tspan fill="white"> vs </tspan>
    <tspan fill="#FCA5A5">RESTRAINING 16</tspan>
    <tspan fill="#A100FF" font-weight="800"> — PROCEED</tspan>
  </text>
</svg>
</div>

<!-- Footer -->
<div class="footer">
  <span>CONFIDENTIAL</span>
  <span>Slide Lab · 2026 · 273</span>
</div>

</body>
</html>
