<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>97 · Mission statement &mdash; single bold mission sentence with tactic + metric</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --brand-primary: #2D0A4E;
  --brand-primary-mid: #5C2D87;
  --brand-accent: #A100FF;
  --brand-accent-soft: #C780FF;
  --text-dark: #1A1A2E;
  --text-mid: #64748B;
  --text-faint: #94A3B8;
  --slide-bg: #FFFFFF;
  --card-bg: #F8F4FC;
  --card-border: #E5D5F0;
  --draft-bg: #FFD600;
  --draft-text: #B71C1C;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1280px; height: 720px;
  background: var(--slide-bg);
  font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  color: var(--text-dark);
  overflow: hidden;
}
body { position: relative; padding: 50px 56px 80px 56px; }

/* ---- Top chrome (invariant zone) ---- */
.project-label {
  position: absolute; top: 24px; left: 24px;
  color: var(--text-faint);
  font-size: 10px; font-weight: 600;
  letter-spacing: 1.5px; text-transform: uppercase;
}
.draft-badge {
  position: absolute; top: 20px; left: 50%;
  transform: translateX(-50%);
  background: var(--draft-bg); color: var(--draft-text);
  font-size: 11px; font-weight: 700;
  padding: 4px 16px; letter-spacing: 1px;
}

/* ---- Action title ---- */
.action-title { font-size: 26px; font-weight: 700; line-height: 1.2; max-width: 1100px; }
.action-title strong { color: var(--brand-primary); }
.title-rule { width: 40px; height: 3px; background: var(--brand-accent); margin: 16px 0 0 0; }

/* ---- Centered mission stage ---- */
.stage {
  position: absolute;
  left: 56px; right: 56px;
  top: 170px; bottom: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 40px;
}

.pre-label {
  color: var(--brand-accent);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 40px;
}

.mission {
  color: var(--brand-primary);
  font-size: 48px;
  font-weight: 500;
  line-height: 1.18;
  letter-spacing: -0.8px;
  max-width: 1040px;
}

.rule {
  width: 120px;
  height: 3px;
  background: var(--brand-accent);
  margin-top: 44px;
  margin-bottom: 36px;
}

/* ---- BY / MEASURED BY sub-points ---- */
.sub-points {
  display: flex;
  gap: 64px;
  max-width: 980px;
  width: 100%;
  justify-content: center;
  align-items: flex-start;
}
.sub-point {
  flex: 1;
  max-width: 440px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sub-label {
  color: var(--brand-accent);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2.2px;
  text-transform: uppercase;
}
.sub-text {
  color: var(--text-dark);
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.45;
}
.sub-divider {
  width: 1px;
  background: var(--card-border);
  align-self: stretch;
}

/* ---- Footer chrome (invariant zone) ---- */
.footer-rule {
  position: absolute; left: 0; right: 0; bottom: 32px;
  height: 1px; background: var(--card-border);
}
.footer-left {
  position: absolute; bottom: 14px; left: 24px;
  color: var(--text-faint);
  font-size: 11px; letter-spacing: 1px;
}
.footer-right {
  position: absolute; bottom: 14px; right: 24px;
  color: var(--text-faint);
  font-size: 11px;
}

/* DARK THEME */
:root {
  --card-bg: rgba(255,255,255,0.07);
  --card-border: rgba(255,255,255,0.12);
  --text-dark: #FFFFFF;
  --text-mid: rgba(255,255,255,0.6);
  --slide-bg: #2D0A4E;
}
html, body { background: #2D0A4E; color: #FFFFFF; }
.project-label { color: rgba(255,255,255,0.4); }
.action-title { color: #FFFFFF; }
.action-title strong { color: #C780FF; }
.mission { color: #FFFFFF; }
.sub-text { color: rgba(255,255,255,0.85); }
.sub-divider { background: rgba(255,255,255,0.12); }
.footer-rule { background: rgba(255,255,255,0.1); }
.footer-left, .footer-right { color: rgba(255,255,255,0.4); }
</style>
</head>
<body>

  <div class="action-title" data-shape-id="title">Our mission &mdash; <strong>sharp thinking, every time.</strong></div>
  <div class="title-rule" data-shape-id="brand-rule"></div>

  <div class="stage">
    <div class="pre-label" data-shape-id="hero-statement-label">Our Mission</div>
    <div class="mission" data-shape-id="hero-statement">Make structured thinking the default for every consulting deck.</div>
    <div class="rule" data-shape-id="hero-rule"></div>

    <div class="sub-points">
      <div class="sub-point">
        <div class="sub-label" data-shape-id="hero-sub-1-label">We do this by</div>
        <div class="sub-text" data-shape-id="hero-sub-1-text">Locking the argument in a coached storyline session before any slide is built.</div>
      </div>
      <div class="sub-divider" data-shape-id="hero-sub-divider"></div>
      <div class="sub-point">
        <div class="sub-label" data-shape-id="hero-sub-2-label">We measure it by</div>
        <div class="sub-text" data-shape-id="hero-sub-2-text">Deck cycle time and first-review partner sign-off rate.</div>
      </div>
    </div>
  </div>
  <div class="footer-left" data-shape-id="footer-left"></div>
  <div class="footer-right" data-shape-id="footer-right"></div>
</body>
</html>
