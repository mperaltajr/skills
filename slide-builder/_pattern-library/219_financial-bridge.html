<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1280"/>
<title>Pattern 219 – Financial Bridge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --brand-primary: #2D0A4E;
    --brand-primary-mid: #5C2D87;
    --brand-accent: #A100FF;
    --brand-accent-soft: #C780FF;
    --text-dark: #1A1A2E;
    --text-mid: #64748B;
    --text-faint: #94A3B8;
    --slide-bg: #FFFFFF;
    --card-bg: #F8F4FC;
    --card-border: #E5D5F0;
    --draft-bg: #FFD600;
    --draft-text: #B71C1C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: var(--slide-bg);
    font-family: Inter, system-ui, sans-serif;
    position: relative;
  }

  /* ── Invariant chrome ── */
  .badge-internal {
    position: absolute;
    top: 14px; left: 20px;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--text-faint);
    font-weight: 500;
    text-transform: uppercase;
  }

  .badge-draft {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--draft-bg);
    color: var(--draft-text);
    font-size: 9px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 0;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .title-block {
    position: absolute; top: 0; left: 0; right: 0; height: 160px;
  }

  .title-block h1 {
    position: absolute; top: 28px; left: 64px; right: 64px; min-height: 36px;
    font-size: 28px;
    font-weight: 700;
    color: var(--brand-primary);
    line-height: 1.2;
  }

  .title-block h1 strong {
    color: var(--brand-accent);
  }

  .title-block .sub {
    position: absolute; top: 108px; left: 64px; right: 64px;
    font-size: 14px;
    font-style: italic;
    color: var(--text-mid);

}

  .accent-rule {
    position: absolute; top: 136px; left: 64px; width: 40px; height: 3px; background: var(--brand-accent);

}

  footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 56px;
    border-top: 1px solid var(--card-border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 20px 8px;
  }

  footer span {
    font-size: 8px;
    color: var(--text-faint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ── Chart area ── */
  .chart-area {
    position: absolute;
    top: 148px;
    left: 48px;
    right: 48px;
    bottom: 56px;
  }

  svg.bridge {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
</style>
</head>
<body>

  <span class="badge-internal">Accenture Internal</span>
  <div class="badge-draft">DRAFT</div>

  <div class="title-block">
    <h1>Revenue bridge: <strong>$3.0B net growth</strong> from 2023 to 2024</h1>
    <p class="sub">Key drivers of year-over-year change — volume, pricing, mix, FX, and cost pressures</p>
    <div style="display:flex; justify-content:space-between; align-items:center;
    top:6px;">
      <div class="accent-rule" style="
    top:0;"></div>
      <div style="display:flex; gap:20px; align-items:center;">
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="width:14px;height:14px;background:#2D0A4E;border-radius:2px;"></div>
          <span style="font-size:11px;color:var(--text-mid);">Absolute value</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="width:14px;height:14px;background:#C780FF;border-radius:2px;"></div>
          <span style="font-size:11px;color:var(--text-mid);">Positive driver</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="width:14px;height:14px;background:#DC2626;border-radius:2px;"></div>
          <span style="font-size:11px;color:var(--text-mid);">Negative driver</span>
        </div>
      </div>
    </div>
  </div>

  <div class="chart-area">
    <svg class="bridge" viewBox="0 0 1184 520" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

      <!--
        Y-axis: $40B (bottom) → $50B (top)
        Chart area: y=20 (top) to y=440 (bottom x-axis)
        Range = $10B over 420px → 42px per $1B

        Bar data (all values in $B):
          0  Start  : base=40, top=45.2  → y=294.4, h=218.4   (absolute bar, from $40B)
          1  Volume : base=45.2, top=47.3 → float y=218.6, h=88.2  (positive)
          2  Pricing: base=47.3, top=49.1 → float y=143.8, h=75.6  (positive)
          3  Mix    : base=49.1, top=50.0 → float y=106.0, h=37.8  (positive)
          4  FX     : base=48.8, top=50.0 → float connector; actual: base=47.4, top=48.8  rising to 48.8 then drops
               Wait — let me be precise:

        Running total after each bar:
          Start  : 45.2
          +Volume: 45.2 + 2.1 = 47.3
          +Pricing: 47.3 + 1.8 = 49.1
          +Mix    : 49.1 + 0.9 = 50.0
          −FX    : 50.0 − 1.2 = 48.8
          −Cost  : 48.8 − 0.6 = 48.2
          End    : 48.2

        yScale: y = 440 − (value − 40) * 42
          40B → 440
          45B → 230
          50B → 20

        Bars (col width=100, gap=36, start x=80):
          Col 0 (Start) : x=80
          Col 1 (Volume): x=216
          Col 2 (Pricing): x=352
          Col 3 (Mix)   : x=488
          Col 4 (FX)    : x=624
          Col 5 (Cost)  : x=760
          Col 6 (End)   : x=896

        Y positions (y = top of bar, h = height):
          Start  : val=45.2, base=40   → yTop=440-(5.2*42)=440-218.4=221.6  h=218.4
          Volume : val=47.3, base=45.2 → yTop=440-(7.3*42)=440-306.6=133.4  h=2.1*42=88.2
          Pricing: val=49.1, base=47.3 → yTop=440-(9.1*42)=440-382.2=57.8   h=1.8*42=75.6
          Mix    : val=50.0, base=49.1 → yTop=440-(10*42)=440-420=20         h=0.9*42=37.8
          FX     : val=48.8, base=50.0 → yTop=440-(10*42)=20  h=-(1.2*42)=-50.4
                   ↑ negative bar: base=50.0→y=20, drops to 48.8→y=70.4
                   so rect: y=20, h=50.4  (drawn downward from 50.0 to 48.8)
          Cost   : val=48.2, base=48.8 → yTop=440-(8.8*42)=440-369.6=70.4  h=0.6*42=25.2
                   ↑ negative: base=48.8→y=70.4, drops to 48.2→y=95.6
                   so rect: y=70.4, h=25.2
          End    : val=48.2, base=40   → yTop=440-(8.2*42)=440-344.4=95.6  h=344.4

        Connector dotted lines (horizontal, at base of next bar):
          Start→Volume : y=221.6  from x=180 to x=216
          Volume→Pricing: y=133.4  from x=316 to x=352
          Pricing→Mix  : y=57.8  from x=452 to x=488
          Mix→FX       : y=20    from x=588 to x=624
          FX→Cost      : y=70.4  from x=724 to x=760
          Cost→End     : y=95.6  from x=860 to x=896
      -->

      <!-- Gridlines & Y-axis -->
      <g class="gridlines" stroke="#E5D5F0" stroke-width="1">
        <!-- $40B --> <line x1="70" y1="440" x2="1100" y2="440"/>
        <!-- $42B --> <line x1="70" y1="356" x2="1100" y2="356" stroke-dasharray="4,4"/>
        <!-- $44B --> <line x1="70" y1="272" x2="1100" y2="272" stroke-dasharray="4,4"/>
        <!-- $46B --> <line x1="70" y1="188" x2="1100" y2="188" stroke-dasharray="4,4"/>
        <!-- $48B --> <line x1="70" y1="104" x2="1100" y2="104" stroke-dasharray="4,4"/>
        <!-- $50B --> <line x1="70" y1="20"  x2="1100" y2="20"  stroke-dasharray="4,4"/>
      </g>

      <!-- Y-axis labels -->
      <g font-size="11" fill="#94A3B8" text-anchor="end" font-family="Inter,system-ui,sans-serif">
        <text x="62" y="444">$40B</text>
        <text x="62" y="360">$42B</text>
        <text x="62" y="276">$44B</text>
        <text x="62" y="192">$46B</text>
        <text x="62" y="108">$48B</text>
        <text x="62" y="24">$50B</text>
      </g>

      <!-- Y-axis line -->
      <line x1="70" y1="20" x2="70" y2="440" stroke="#E5D5F0" stroke-width="1"/>

      <!-- ── Connector dotted lines ── -->
      <g stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,3">
        <!-- Start → Volume (at 45.2 = y221.6) -->
        <line x1="180" y1="221.6" x2="216" y2="221.6"/>
        <!-- Volume → Pricing (at 47.3 = y133.4) -->
        <line x1="316" y1="133.4" x2="352" y2="133.4"/>
        <!-- Pricing → Mix (at 49.1 = y57.8) -->
        <line x1="452" y1="57.8" x2="488" y2="57.8"/>
        <!-- Mix → FX (at 50.0 = y20) -->
        <line x1="588" y1="20" x2="624" y2="20"/>
        <!-- FX → Cost (at 48.8 = y70.4) -->
        <line x1="724" y1="70.4" x2="760" y2="70.4"/>
        <!-- Cost → End (at 48.2 = y95.6) -->
        <line x1="860" y1="95.6" x2="896" y2="95.6"/>
      </g>

      <!-- ── Bars ── -->

      <!-- Col 0: Start $45.2B (absolute, brand-primary) -->
      <rect x="80" y="221.6" width="100" height="218.4" fill="#2D0A4E" rx="2"/>

      <!-- Col 1: +Volume $2.1B (positive, accent-soft) -->
      <rect x="216" y="133.4" width="100" height="88.2" fill="#C780FF" rx="2"/>

      <!-- Col 2: +Pricing $1.8B (positive, accent-soft) -->
      <rect x="352" y="57.8" width="100" height="75.6" fill="#C780FF" rx="2"/>

      <!-- Col 3: +Mix $0.9B (positive, accent-soft) -->
      <rect x="488" y="20" width="100" height="37.8" fill="#C780FF" rx="2"/>

      <!-- Col 4: −FX $1.2B (negative, red) — hangs from 50.0 down to 48.8 -->
      <rect x="624" y="20" width="100" height="50.4" fill="#DC2626" rx="2"/>

      <!-- Col 5: −Cost $0.6B (negative, red) — hangs from 48.8 down to 48.2 -->
      <rect x="760" y="70.4" width="100" height="25.2" fill="#DC2626" rx="2"/>

      <!-- Col 6: End $48.2B (absolute, brand-primary) -->
      <rect x="896" y="95.6" width="100" height="344.4" fill="#2D0A4E" rx="2"/>

      <!-- ── Delta annotations above/below each driver bar ── -->
      <g font-family="Inter,system-ui,sans-serif" font-weight="700" text-anchor="middle">

        <!-- Volume +$2.1B (above bar top) -->
        <text x="266" y="124" font-size="12" fill="#7C3AED">+$2.1B</text>

        <!-- Pricing +$1.8B -->
        <text x="402" y="48" font-size="12" fill="#7C3AED">+$1.8B</text>

        <!-- Mix +$0.9B -->
        <text x="538" y="12" font-size="12" fill="#7C3AED">+$0.9B</text>

        <!-- FX −$1.2B (below bottom of red bar, i.e. y=70.4+12) -->
        <text x="674" y="84" font-size="12" fill="#DC2626">−$1.2B</text>

        <!-- Cost −$0.6B -->
        <text x="810" y="110" font-size="12" fill="#DC2626">−$0.6B</text>

      </g>

      <!-- ── Bar value labels (inside or above bars) ── -->
      <g font-family="Inter,system-ui,sans-serif" text-anchor="middle" font-weight="600">

        <!-- Start label inside bar -->
        <text x="130" y="246" font-size="13" fill="#FFFFFF">$45.2B</text>
        <text x="130" y="263" font-size="10" fill="#C780FF">Revenue</text>
        <text x="130" y="276" font-size="10" fill="#C780FF">2023</text>

        <!-- End label inside bar -->
        <text x="946" y="120" font-size="13" fill="#FFFFFF">$48.2B</text>
        <text x="946" y="137" font-size="10" fill="#C780FF">Revenue</text>
        <text x="946" y="150" font-size="10" fill="#C780FF">2024</text>

      </g>

      <!-- ── X-axis labels ── -->
      <g font-family="Inter,system-ui,sans-serif" font-size="11" fill="#64748B" text-anchor="middle">
        <text x="130" y="462">2023</text>
        <text x="266" y="462">Volume</text>
        <text x="266" y="475">Growth</text>
        <text x="402" y="462">Pricing</text>
        <text x="538" y="462">Mix</text>
        <text x="674" y="462">FX</text>
        <text x="674" y="475">Headwind</text>
        <text x="810" y="462">Cost</text>
        <text x="810" y="475">Inflation</text>
        <text x="946" y="462">2024</text>
      </g>

      <!-- ── X-axis base line ── -->
      <line x1="70" y1="440" x2="1060" y2="440" stroke="#64748B" stroke-width="1.5"/>

      <!-- ── Net delta callout band ── -->
      <!-- Bracket from start top (y=221.6) to end top (y=95.6) -->
      <g stroke="#A100FF" stroke-width="1.5" fill="none">
        <!-- Left tick at start bar right edge -->
        <line x1="182" y1="221.6" x2="188" y2="221.6"/>
        <!-- Horizontal line at start level going right -->
        <!-- Right tick at end bar left edge -->
        <line x1="894" y1="95.6" x2="900" y2="95.6"/>
      </g>

      <!-- Net change label box -->
      <rect x="1010" y="150" width="80" height="42" rx="4" fill="#F8F4FC" stroke="#E5D5F0" stroke-width="1"/>
      <text x="1050" y="168" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#64748B" text-anchor="middle" font-weight="500">Net change</text>
      <text x="1050" y="184" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#A100FF" text-anchor="middle" font-weight="700">+$3.0B</text>

      <!-- Arrow from net-change box to bridge -->
      <line x1="1010" y1="171" x2="1000" y2="171" stroke="#A100FF" stroke-width="1" stroke-dasharray="3,2"/>

    </svg>
  </div>

  <footer>
    <span>Confidential — Accenture Internal</span>
    <span>Slide Lab · 2026 · 219</span>
  </footer>

</body>
</html>
