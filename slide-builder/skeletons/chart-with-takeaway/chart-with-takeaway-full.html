<!-- SKELETON
  id: chart-with-takeaway-full
  category: chart-with-takeaway
  page-types: Chart, Data, Analytics
  zones: action_title, sub_headline, chart_title, chart_subtitle, annotation, footnote, source
  best-for: Data-heavy chart that needs the full slide width with no side panel; annotation placed inline below the chart
  body: x=58 y=151 w=1164 h=521
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  .draft-badge {
    position: absolute;
    left: 610px; top: 4px; width: 60px; height: 20px;
    background: #FFC000;
    border: 2px solid #CC0000;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #CC0000;
  }

  .zone-title {
    position: absolute;
    left: 58px; top: 19px; width: 1164px; height: 77px;
    background: #E6F1FB;
    border: 1px dashed #378ADD;
    padding: 10px 14px;
    display: flex; align-items: center;
  }
  .zone-label {
    display: block; font-size: 7px; color: #888; font-style: italic; margin-bottom: 4px;
  }
  .zone-title span:not(.zone-label) {
    font-size: 20px; font-weight: 700; color: #1a1a1a; line-height: 1.2;
  }

  .zone-sub {
    position: absolute;
    left: 58px; top: 96px; width: 1164px; height: 26px;
    background: #F0F4FB;
    border: 1px dashed #85B7EB;
    padding: 0 14px;
    display: flex; align-items: center;
  }
  .zone-sub span:not(.zone-label) {
    font-size: 11px; color: #444;
  }

  .zone-body {
    position: absolute;
    left: 58px; top: 151px; width: 1164px; height: 521px;
    background: #EAF3DE;
    border: 1px dashed #639922;
    padding: 14px;
  }
  .chart-title {
    font-size: 10px; font-weight: 700; color: #333;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .chart-subtitle {
    font-size: 9px; color: #555; margin-top: 2px; margin-bottom: 8px;
  }
  .chart-placeholder {
    width: 100%; height: 400px;
    border: 1px dashed #aaa;
    display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 13px; font-style: italic;
  }
  .annotation {
    margin-top: 8px;
    font-size: 9px; color: #555;
  }

  .zone-footnote {
    position: absolute;
    left: 58px; top: 672px; width: 1164px; height: 16px;
    background: #F1EFE8; border: 1px solid #BBBBBB;
    padding: 2px 14px;
    font-size: 8px; color: #444;
  }
  .zone-source {
    position: absolute;
    left: 58px; top: 688px; width: 900px; height: 14px;
    background: #F1EFE8; border: 1px solid #BBBBBB;
    padding: 1px 14px;
    font-size: 8px; color: #444;
  }
  .page-number {
    position: absolute;
    right: 58px; top: 690px;
    font-size: 8px; color: #666;
  }
</style>
</head>
<body>
<div class="slide">

  <div class="draft-badge">DRAFT</div>

  <div class="zone-title">
    <span class="zone-label">action_title — native placeholder, inherits font/color from client master</span>
    <span>{{ACTION_TITLE}}</span>
  </div>

  <div class="zone-sub">
    <span class="zone-label">sub_headline — native placeholder, inherits from client master</span>
    <span>{{SUB_HEADLINE}}</span>
  </div>

  <div class="zone-body">
    <div class="chart-title">{{CHART_TITLE}}</div>
    <div class="chart-subtitle">{{CHART_SUBTITLE}}</div>
    <div class="chart-placeholder">[Chart — full width, no panel]</div>
    <div class="annotation">{{ANNOTATION}}</div>
  </div>

  <div class="zone-footnote">1. {{FOOTNOTE}}</div>
  <div class="zone-source">Source: {{SOURCE}}</div>
  <div class="page-number">1</div>

</div>
</body>
</html>
